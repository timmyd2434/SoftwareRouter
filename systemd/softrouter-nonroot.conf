# softrouter-nonroot.conf - systemd drop-in that runs the SoftRouter web service without root.
#
# Installed as /etc/systemd/system/softrouter.service.d/10-nonroot.conf by
# "scripts/softrouter-nonroot apply" and removed by "... rollback". A drop-in, not an edit of
# softrouter.service, because update.sh overwrites that file on every update.
#
# Everything that needs root (firewall, interfaces, services, VPN config files) goes through the
# privileged helper (softrouter-privhelper.service), which validates each request.

[Unit]
After=softrouter-privhelper.service
Wants=softrouter-privhelper.service

[Service]
User=softrouter
Group=softrouter

# The root unit grants network capabilities and module loading. The web server needs none of
# that: reset the lists, then keep only the right to listen on ports 80/443.
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=
AmbientCapabilities=CAP_NET_BIND_SERVICE

# No sudo is used any more, so privilege can never be regained.
NoNewPrivileges=yes
RestrictSUIDSGID=yes

# Read-only file system except the service's own state. A leading "-" means "ignore if the
# directory does not exist". /tmp stays shared because the helper reads files staged there.
ProtectSystem=strict
ReadWritePaths=-/etc/softrouter -/var/log/softrouter -/var/backups/softrouter -/var/www/softrouter/vpn_configs -/tmp
ProtectHome=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
ProtectClock=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
